[info]
name = "Companion Theme for Visual Page Builder"
version = "2.1.0"
author = "Dickinson Historical Society"
description = "A clean theme made for the Visual Page Builder module: pages look the way you build them, Special Blocks fit in, and the menu builder's menu styles work."
omeka_version_constraint = "^4.1.0"

[config]
elements.logo.name = "logo"
elements.logo.type = "Omeka\Form\Element\Asset"
elements.logo.options.label = "Logo"
elements.logo.options.info = "Shown in the header instead of the site title. Upload it under Assets first."

elements.accent_color.name = "accent_color"
elements.accent_color.type = "Omeka\Form\Element\ColorPicker"
elements.accent_color.options.label = "Accent color"
elements.accent_color.options.info = "Links, buttons, and highlights. Pick a dark enough color for white text to be readable on it."
elements.accent_color.attributes.value = "#0f5e54"

elements.header_color.name = "header_color"
elements.header_color.type = "Omeka\Form\Element\ColorPicker"
elements.header_color.options.label = "Header background"
elements.header_color.attributes.value = "#ffffff"

elements.background_color.name = "background_color"
elements.background_color.type = "Omeka\Form\Element\ColorPicker"
elements.background_color.options.label = "Page background"
elements.background_color.attributes.value = "#fbf8f1"

elements.heading_font.name = "heading_font"
elements.heading_font.type = "Select"
elements.heading_font.options.label = "Heading font"
elements.heading_font.options.value_options.serif = "Classic serif"
elements.heading_font.options.value_options.sans = "Modern sans-serif"
elements.heading_font.options.value_options.humanist = "Friendly sans-serif"
elements.heading_font.options.value_options.slab = "Slab serif"
elements.heading_font.attributes.value = "serif"

elements.body_font.name = "body_font"
elements.body_font.type = "Select"
elements.body_font.options.label = "Text font"
elements.body_font.options.value_options.sans = "Modern sans-serif"
elements.body_font.options.value_options.serif = "Classic serif"
elements.body_font.options.value_options.humanist = "Friendly sans-serif"
elements.body_font.attributes.value = "sans"

elements.content_width.name = "content_width"
elements.content_width.type = "Select"
elements.content_width.options.label = "Page width"
elements.content_width.options.value_options.narrow = "Narrow (easy reading)"
elements.content_width.options.value_options.standard = "Standard"
elements.content_width.options.value_options.wide = "Wide"
elements.content_width.attributes.value = "standard"

elements.menu_style.name = "menu_style"
elements.menu_style.type = "Select"
elements.menu_style.options.label = "Menu style (if not chosen in the menu builder)"
elements.menu_style.options.info = "The menu builder (Modules › Visual Builder › Edit menu) sets this for you, with a preview."
elements.menu_style.options.value_options.bar = "Simple bar"
elements.menu_style.options.value_options.dropdown = "Drop-down menus"
elements.menu_style.options.value_options.mega = "Large panels"
elements.menu_style.options.value_options.centered = "Centered logo"
elements.menu_style.options.value_options.sidebar = "Side menu"
elements.menu_style.options.value_options.centered-band = "Centered, menu in a color band"
elements.menu_style.options.value_options.masthead = "Newspaper masthead"
elements.menu_style.options.value_options.centered-dividers = "Centered, with dividers"
elements.menu_style.options.value_options.centered-caps = "Centered, small capitals"
elements.menu_style.options.value_options.split = "Logo in the middle"
elements.menu_style.options.value_options.right = "Logo left, menu right"
elements.menu_style.options.value_options.pills = "Rounded buttons"
elements.menu_style.options.value_options.tabs = "Tabs"
elements.menu_style.options.value_options.two-tier = "Two rows"
elements.menu_style.options.value_options.button = "Menu button only"
elements.menu_style.options.value_options.sidebar-right = "Side menu on the right"
elements.menu_style.options.value_options.vertical-list = "Vertical list, everything showing"
elements.menu_style.options.value_options.vertical-flyout = "Vertical, sub-pages fly out"
elements.menu_style.options.value_options.vertical-boxed = "Vertical, in a panel"
elements.menu_style.attributes.value = "dropdown"

elements.show_search.name = "show_search"
elements.show_search.type = "Checkbox"
elements.show_search.options.label = "Show a search box in the header"
elements.show_search.attributes.value = "1"

elements.footer_text.name = "footer_text"
elements.footer_text.type = "Textarea"
elements.footer_text.options.label = "Footer text"
elements.footer_text.options.info = "Plain text, for example your name and copyright line."

elements.footer_visit_info.name = "footer_visit_info"
elements.footer_visit_info.type = "Checkbox"
elements.footer_visit_info.options.label = "Show the site's visit info (address and hours) in the footer"
elements.footer_visit_info.options.info = "Uses the Visit info settings added by the Visual Page Builder module."
elements.footer_visit_info.attributes.value = "1"

elements.facebook_url.name = "facebook_url"
elements.facebook_url.type = "Text"
elements.facebook_url.options.label = "Facebook page address"

elements.instagram_url.name = "instagram_url"
elements.instagram_url.type = "Text"
elements.instagram_url.options.label = "Instagram address"

elements.youtube_url.name = "youtube_url"
elements.youtube_url.type = "Text"
elements.youtube_url.options.label = "YouTube address"

elements.secondary_color.name = "secondary_color"
elements.secondary_color.type = "Omeka\Form\Element\ColorPicker"
elements.secondary_color.options.label = "Secondary color"
elements.secondary_color.options.info = "Captions, notes, and less important text."
elements.secondary_color.attributes.value = "#5b5348"

elements.text_color.name = "text_color"
elements.text_color.type = "Omeka\Form\Element\ColorPicker"
elements.text_color.options.label = "Text color"
elements.text_color.attributes.value = "#1f1b16"

elements.link_color.name = "link_color"
elements.link_color.type = "Omeka\Form\Element\ColorPicker"
elements.link_color.options.label = "Link color"
elements.link_color.options.info = "Leave blank to use the primary color."
elements.link_color.attributes.value = ""

elements.text_size.name = "text_size"
elements.text_size.type = "Select"
elements.text_size.options.label = "Text size"
elements.text_size.options.value_options.small = "Smaller"
elements.text_size.options.value_options.medium = "Standard"
elements.text_size.options.value_options.large = "Larger"
elements.text_size.attributes.value = "medium"

elements.corner_style.name = "corner_style"
elements.corner_style.type = "Select"
elements.corner_style.options.label = "Corners"
elements.corner_style.options.value_options.square = "Square"
elements.corner_style.options.value_options.soft = "Soft"
elements.corner_style.options.value_options.round = "Round"
elements.corner_style.attributes.value = "soft"
